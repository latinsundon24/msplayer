name: msplayer
options:
  bundleIdPrefix: com.msplayer
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "15.4"
  projectFormat: xcode15_3

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    version: "1.1.0-n9.0.2"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_BITCODE: "NO"
    CLANG_ENABLE_MODULES: "YES"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  msplayer:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    dependencies:
      - package: MPVKit
    sources:
      - path: msplayer
        excludes:
          - "Resources/demo.m3u"
          - "Resources/demo-dash/**"
          - "Info.plist"
      - path: msplayer/Resources/demo.m3u
        buildPhase: resources
      - path: msplayer/Resources/demo-dash
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msplayer.app
        PRODUCT_NAME: msplayer
        MARKETING_VERSION: "1.12"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: msplayer
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: msplayer/Info.plist
      properties:
        CFBundleDisplayName: msplayer
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false

  MSCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: msplayer/Models.swift
      - path: msplayer/PlaylistParser.swift
      - path: msplayer/Support
      - path: msplayer/EPG
      - path: msplayer/DASH/CENC.swift
      - path: msplayer/DASH/MP4Box.swift
      - path: TestsMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msplayer.coretests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        MACOSX_DEPLOYMENT_TARGET: "13.0"

schemes:
  msplayer:
    build:
      targets:
        msplayer: all
    run:
      config: Debug
    archive:
      config: Release
  MSCoreTests:
    build:
      targets:
        MSCoreTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MSCoreTests

