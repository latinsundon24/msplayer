name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p
          ruby --version
          pod --version || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        env:
          COCOAPODS_DISABLE_STATS: "true"
        run: pod install --repo-update

      - name: Resolve Swift packages (MPVKit)
        # 与后面的 Release 构建共用 build/SourcePackages，避免几百 MB 的 xcframework 被下载两次
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace msplayer.xcworkspace \
            -scheme msplayer \
            -derivedDataPath build

      - name: Compute auto-incrementing version (base + run number)
        id: ver
        run: |
          BASE=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          PATCH="${{ github.run_number }}"
          FULL="${BASE}.${PATCH}"
          echo "BASE=$BASE" >> "$GITHUB_OUTPUT"
          echo "PATCH=$PATCH" >> "$GITHUB_OUTPUT"
          echo "FULL=$FULL" >> "$GITHUB_OUTPUT"
          echo "App version this build: $FULL (build $PATCH)"

      - name: Core logic tests (macOS)
        run: |
          xcodebuild test \
            -project msplayer.xcodeproj \
            -scheme MSCoreTests \
            -destination 'platform=macOS' \
            -derivedDataPath build-tests \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-tests.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msplayer-tests-log
          path: xcodebuild-tests.log
          if-no-files-found: ignore

      - name: Build unsigned app (iOS device)
        env:
          FULL: ${{ steps.ver.outputs.FULL }}
          PATCH: ${{ steps.ver.outputs.PATCH }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace msplayer.xcworkspace \
            -scheme msplayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=$FULL \
            CURRENT_PROJECT_VERSION=$PATCH \
            build

      - name: Verify MPVKit really linked
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          du -sh "$APP"
          BIN="$APP/msplayer"
          if nm -gU "$BIN" 2>/dev/null | grep -qi "mpv_create"; then
            echo "MPVKit: linked (symbol mpv_create present)"
          elif strings "$BIN" 2>/dev/null | grep -qi "libmpv"; then
            echo "MPVKit: linked (libmpv strings present)"
          else
            echo "MPVKit NOT linked into the app binary"
            nm -gU "$BIN" 2>/dev/null | grep -i mpv | head -20 || true
            exit 1
          fi

      - name: Package unsigned IPA
        env:
          FULL: ${{ steps.ver.outputs.FULL }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "app not found"
            exit 1
          fi
          echo "APP=$APP"
          du -sh "$APP"
          echo "App version: $FULL"
          IPA="msplayer-${FULL}-unsigned.ipa"
          rm -rf Payload "$IPA"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA" Payload
          shasum -a 256 "$IPA" | tee "${IPA}.sha256"
          ls -lh "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: msplayer-unsigned-ipa
          path: |
            msplayer-*-unsigned.ipa
            msplayer-*-unsigned.ipa.sha256
          if-no-files-found: error

